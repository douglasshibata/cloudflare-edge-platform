services:
  cloudflare-edge:
    image: node:20-alpine
    container_name: cloudflare-edge-platform
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npx wrangler dev --ip 0.0.0.0 --port 8787"
    restart: unless-stopped
