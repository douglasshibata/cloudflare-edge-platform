name = "cloudflare-edge-platform"
main = "src/index.ts"
compatibility_date = "2024-04-03"
compatibility_flags = [ "nodejs_compat" ]

# KV Namespace Binding
[[kv_namespaces]]
binding = "KV_CACHE"
id = "kv_cache_id"
preview_id = "kv_cache_preview_id"

# R2 Bucket Binding
[[r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "r2-storage-bucket"
preview_bucket_name = "r2-storage-bucket-preview"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "d1-database"
database_id = "d1-database-id"
preview_database_id = "d1-database-preview-id"
migrations_dir = "migrations"

# Durable Objects configuration
[durable_objects]
bindings = [
  { name = "COUNTER_OR_STATE", class_name = "CounterOrState" }
]

[[migrations]]
tag = "v1"
new_classes = ["CounterOrState"]
